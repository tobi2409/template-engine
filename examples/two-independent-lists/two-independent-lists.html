<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Independent Lists</title>
    <link rel="stylesheet" href="two-independent-lists.css" />
</head>
<body>

<template id="tpl">

    <h1>Two Independent Lists</h1>

    <section>
        <h3>🍎 Fruits</h3>
        <div class="list">
            <each of="fruits" as="fruit">
                <span class="item"><get>fruit.name</get></span>
            </each>
        </div>
        <button action-click="renameFruitFirst">Rename first</button>
        <button action-click="renameFruitLast">Rename last</button>
        <button action-click="addFruit">Add</button>
        <button action-click="removeFruitFirst">Remove first</button>
        <button action-click="checkRendered">Verify Rendered Updates</button>
    </section>

    <section>
        <h3>🎨 Colors</h3>
        <div class="list">
            <each of="colors" as="color">
                <span class="item"><get>color.name</get></span>
            </each>
        </div>
        <button action-click="renameColorFirst">Rename first</button>
        <button action-click="renameColorLast">Rename last</button>
        <button action-click="addColor">Add</button>
        <button action-click="removeColorFirst">Remove first</button>
    </section>

</template>

<div id="app"></div>
<template-use id="tpl-use" template-id="tpl" mount-id="app"></template-use>

<script type="module" src="./two-independent-lists.js"></script>

</body>
</html>
