<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Demo - Template Engine</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; }
        .folder { cursor: pointer; user-select: none; }
        .folder:hover { background: #f0f0f0; }
        .expand-btn { 
            display: inline-block; 
            width: 20px; 
            text-align: center;
            font-weight: bold;
        }
        ul { list-style: none; }
    </style>
</head>
<body>

    <div id="app"></div>

    <template id="folder-template">
        <each of="*list" as="folder">
            <li>
                <div class="folder" attr-folder-id="folder.id">
                    <span class="expand-btn" action-click="expand"><get>folder.expandIcon</get></span>
                    📁 <get>folder.name</get>
                </div>

                <if test="folder.expanded" wrapper="li" justHideChildren="true">
                    <ul>
                        <template-use template-id="folder-template" data-list="folder.children"></template-use>
                    </ul>
                </if>
            </li>
        </each>
    </template>

    <template id="app-template">
        <h1>📂 Lazy-Loading File System</h1>
        <p>Click on folders to expand and load their contents</p>
        <p>Current user: <strong><get>userName</get></strong></p>

        <ul>
            <template-use template-id="folder-template" data-list="folders"></template-use>
        </ul>
        <button action-click="checkRendered">Verify Rendered Updates</button>
    </template>

    <template-use id="app-template-use" template-id="app-template" mount-id="app"></template-use>

    <script type="module">
        import TemplateEngine from '../src/template-engine.js'

        let data = TemplateEngine.reactive({
            userName: 'Sarah Miller',
            folders: [
                { 
                    id: 1, 
                    name: 'components', 
                    hasChildren: true, 
                    expanded: false, 
                    expandIcon: '▶', 
                    children: [
                        { id: 11, name: 'Header.jsx', hasChildren: false, expanded: false, expandIcon: ' ', children: [] },
                        { id: 12, name: 'Footer.jsx', hasChildren: false, expanded: false, expandIcon: ' ', children: [] },
                        { id: 13, name: 'main', hasChildren: true, expanded: false, expandIcon: '▶', children: [
                            { id: 131, name: 'Dashboard.jsx', hasChildren: false, expanded: false, expandIcon: ' ', children: [] }
                        ] }
                    ]
                },
                { 
                    id: 2, 
                    name: 'documents', 
                    hasChildren: true, 
                    expanded: false, 
                    expandIcon: '▶', 
                    children: [
                        { id: 21, name: 'report.pdf', hasChildren: false, expanded: false, expandIcon: ' ', children: [] },
                        { id: 22, name: 'notes.txt', hasChildren: false, expanded: false, expandIcon: ' ', children: [] }
                    ]
                }
            ],
            expand(e, dataElement) {
                dataElement.expanded = !dataElement.expanded
            }
        }, document.getElementById('app-template-use'))

        data.folders[0].children.splice(1, 1)
        data.folders[1].children.splice(1, 0, { id: 23, name: 'summary.docx', hasChildren: false, expanded: false, expandIcon: ' ', children: [] })
        
        data.checkRendered = function() {
            const msgs = []
            const el23 = document.querySelector('[folder-id="23"]')
            msgs.push(el23 ? 'Folder 23 present' : 'Folder 23 missing')
            msgs.push(document.body.textContent.includes('summary.docx') ? 'summary.docx present' : 'summary.docx missing')
            const ok = msgs.every(m => /present/.test(m))
            const msg = (ok ? 'All checks passed:\n' : 'Some checks failed:\n') + msgs.join('\n')
            console.log(msg)
            alert(msg)
        }
        
    </script>

</body>
</html>
