<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div id="app"></div>
        
        <template id="ul-structured-data">
            <ul>
                <each of="*list" as="p">
                    <li>
                        <input type="text" bind-input-value="p.name" />
                        <input type="text" bind-input-value="p.wage" />
                        <input type="number" bind-input-value="p.age" />
                        <input type="text" bind-input-value="p.address.street" />
                        <input type="text" bind-input-value="p.address.city" />

                        <template-use
                            template-id="ul-structured-data"
                            data-list="p.children"></template-use>
                    </li>
                </each>
            </ul>
        </template>

        <template id="table-structured-data-content">
            <each of="*list" as="p">
                <div class="tree-node">
                    <div class="table-row">
                        <div class="table-cell"><input type="text" bind-input-value="p.name" /></div>
                        <div class="table-cell"><input type="text" bind-input-value="p.wage" /></div>
                        <div class="table-cell"><input type="number" bind-input-value="p.age" /></div>
                        <div class="table-cell"><input type="text" bind-input-value="p.address.street" /></div>
                        <div class="table-cell"><input type="text" bind-input-value="p.address.city" /></div>
                    </div>

                    <div class="tree-children">
                        <!-- parent wie tree-children sollte vorhanden sein -->
                        <!-- beim Hinzufügen kann kommender each-NodeHolder sonst beim rekursiven Aufstieg nur auf DocumentFragment zugreifen -->
                        <!-- das initiale Rendering hingegen funktioniert, weil der rekursive Aufstieg bis zum App-Parent läuft -->

                        <template-use
                            template-id="table-structured-data-content"
                            data-list="p.children"></template-use>
                    </div>
                </div>
            </each>
        </template>
        
        <template id="table-structured-data">
            <div class="table">
                <div class="table-row-header-outer">
                    <div class="table-row header">
                        <div class="table-cell">Name</div>
                        <div class="table-cell">Wage</div>
                        <div class="table-cell">Age</div>
                        <div class="table-cell">Street</div>
                        <div class="table-cell">City</div>
                    </div>
                </div>

                <template-use
                    template-id="table-structured-data-content"
                    data-list="persons"></template-use>
            </div>
        </template>

        <template id="app-template">
            <h1>👋 Hello, <get>user</get></h1>

            <template-use
                template-id="ul-structured-data"
                data-list="persons"></template-use>

            <!--<template-use
                template-id="table-structured-data"
                data-list="persons"></template-use>-->

            <br />
            <button action-click="demoUpdates">Demo Updates</button>

            <br />
            <button action-click="logModels">Log Models</button>
        </template>

        <template-use
            id="app-template-use"
            template-id="app-template"
            mount-id="app"
        >
        </template-use>

        <script type="module" src="index.js"></script>
    </body>
</html>
