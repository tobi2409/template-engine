<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div id="app"></div>
        
        <template id="table-structured-data-content">
            <each of="*list" as="p">
                <div class="tree-node">
                    <div class="table-row">
                        <div class="table-cell"><get>p.layerDecoration</get></div>
                        <div class="table-cell"><input type="text" bind-input-value="p.name" /></div>
                        <div class="table-cell"><input type="text" bind-input-value="p.wage" /></div>
                        <div class="table-cell"><input type="number" bind-input-value="p.age" /></div>
                    </div>

                    <div class="tree-children">
                        <template-use
                            template-id="table-structured-data-content"
                            data-list="p.childs"></template-use>
                    </div>
                </div>
            </each>
        </template>
        
        <template id="table-structured-data">
            <div class="table">
                <div class="table-row header">
                    <div class="table-cell"></div>
                    <div class="table-cell">Name:</div>
                    <div class="table-cell">Wage</div>
                    <div class="table-cell">Age</div>
                </div>

                <template-use
                    template-id="table-structured-data-content"
                    data-list="beautifiedPersons"></template-use>
            </div>
        </template>

        <template id="ul-structured-data">
            <ul>
                <each of="*list" as="p">
                    <li>
                        <get>p.layerDecoration</get>
                        <input type="text" bind-input-value="p.name" />
                        <input type="text" bind-input-value="p.wage" />
                        <input type="number" bind-input-value="p.age" />

                        <template-use
                            template-id="ul-structured-data"
                            data-list="p.childs"></template-use>
                    </li>
                </each>
            </ul>
        </template>

        <template id="app-template">
            <h1>👋 Hello, <get>user</get></h1>

            <!--<template-use
                template-id="ul-structured-data"
                data-list="beautifiedPersons"></template-use>-->

            <template-use
                template-id="table-structured-data"
                data-list="persons"></template-use>

            <br />
            <button action-click="newDemoChild_MaxJr">Add Demo Child to Max Jr.</button>
            <br />
            <button action-click="logModels">Log Models</button>
        </template>

        <template-use
            id="app-template-use"
            template-id="app-template"
            mount-id="app"
        >
        </template-use>

        <script type="module" src="index.js"></script>
    </body>
</html>
