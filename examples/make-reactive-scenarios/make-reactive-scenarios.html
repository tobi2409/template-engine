<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>makeReactive – all scenarios</title>
    <link rel="stylesheet" href="make-reactive-scenarios.css" />
</head>
<body>

<template id="tpl">

    <!-- ① Entry point: makeReactive(data) makes all properties reactive -->
    <section>
        <h3>① Entry point — makeReactive(data)</h3>
        <small>data.person.name = 'Lisa' triggers refresh</small>
        <p>person.name: <span class="val"><get>person.name</get></span></p>
        <button action-click="s1">person.name = 'Lisa'</button>
    </section>

    <!-- ② Nested objects: defineReactiveDataProperty, initial & after setter -->
    <section>
        <h3>② Nested objects — defineReactiveDataProperty</h3>
        <small>Deeply nested objects become reactive immediately, including newly assigned objects.
            Note: replacing an object does not automatically notify child keys.
            An explicit child-property assignment is required.</small>
        <p>person.address.city: <span class="val"><get>person.address.city</get></span></p>
        <button action-click="s2a">address.city = 'Hamburg'</button>
        <button action-click="s2b">address = { city: 'Köln' } + city = 'Köln'</button>
        <button action-click="s2c">(afterwards) city = 'Bonn'</button>
    </section>

    <!-- ③ Computed Accessor: defineReactiveAccessorProperty, get + set -->
    <section>
        <h3>③ Computed Accessor — defineReactiveAccessorProperty</h3>
        <small>The object returned by the getter stays reactive, also after setter assignment.
            Note: same pattern as ② — after replacing the object,
            an explicit child-property assignment is required.</small>
        <p>selectedPerson.name: <span class="val"><get>selectedPerson.name</get></span></p>
        <button action-click="s3a">selectedPerson.name = 'Finn'</button>
        <button action-click="s3b">selectedPerson = { name: 'Mia' } + name = 'Mia'</button>
        <button action-click="s3c">(afterwards) selectedPerson.name = 'Luisa'</button>
    </section>

    <!-- ④ Array entries: makeArrayItemsReactive &amp; patchArrayMethods.push -->
    <section>
        <h3>④ Array entries — makeArrayItemsReactive &amp; patchArrayMethods</h3>
        <small>Existing entries are reactive at startup. New entries after push() are reactive too.</small>
        <div>
            <each of="persons" as="p">
                <div class="list-item"><get>p.name</get></div>
            </each>
        </div>
        <button action-click="s4a">persons[0].name = 'Clara'</button>
        <button action-click="s4b">persons.push({ name: 'David' })</button>
        <button action-click="s4c">(afterwards) persons[last].name = 'Daniel'</button>
        
    </section>

</template>

<div id="app"></div>
<template-use id="tpl-use" template-id="tpl" mount-id="app"></template-use>

<script type="module" src="./make-reactive-scenarios.js"></script>

</body>
</html>
