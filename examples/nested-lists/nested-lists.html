<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Lists Demo - Template Engine</title>
</head>
<body>

    <div id="app"></div>

    <template id="app-template">
        <h1>🏢 Company Organization Chart</h1>
        <p>User: <strong><get>name</get></strong> (<get>age</get> years old)</p>
        <p>Department: <get>param1</get></p>

        <h2>Team Structure</h2>
        <button action-click="runDemoUpdates">⚡ Run Demo Updates</button>
        <ul id="persons-list">
            <each of="persons" as="p">
                <li attr-person-id="p.id"><strong><get>p.name</get></strong> - <get>p.role</get>

                    <ul>
                        <each of="p.children" as="c">
                            <li attr-child-id="c.id"><get>c.name</get> (<get>param1</get> team)</li>
                        </each>
                    </ul>

                </li>
            </each>
        </ul>
    </template>

    <template-use id="app-template-use" template-id="app-template" mount-id="app" data-param1="Engineering"></template-use>

    <script type="module" src="./nested-lists.js"></script>

</body>

</html>
