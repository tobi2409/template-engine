<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVVM Demo - Template Engine</title>
</head>
<body>

    <div id="app"></div>

    <template id="app-template">
        <h1>👋 Hello World</h1>

        <button action-click="runDemoUpdates">⚡ Run Demo Updates</button>

        <p id="first-name-row">First Name: <get>firstName</get></p>
        <p>Last Name: <get>lastName</get></p>
        <p><b>Full Name: <get>fullName</get></b></p>

        <input type="text" bind-input-value="firstName" placeholder="First Name ..."/>
        <input type="text" bind-input-value="lastName" placeholder="Last Name ..."/>

        <br/><br/>

        <div>
            <if test="showWage">
                <p id="wage-row">💵 Wage: $<get>wage</get></p>
                <p id="wage-block"><b><get>fullInfo</get></b></p>
            </if>

            Wage:
            <input type="number" bind-input-value="wage" placeholder="Wage ..."/>
        </div>

        <h2>Person Data</h2>

        <button action-click="addPersonInfo">➕ Add Person</button>
        <button action-click="logModels">📝 Log Models</button>

        <ul id="person-list">
            <each of="beautifiedPersonData.data" as="personInfo">
                <li attr-item-index="personInfo.id">
                    <get>personInfo.name</get> (<get>personInfo.age</get> years old)

                    <if test="personInfo.showEdit">
                        <input type="text" bind-input-value="personInfo.name" placeholder="Name ..." />
                        <input type="number" bind-input-value="personInfo.age" placeholder="Age ..." />
                    </if>

                    <button action-click="editPersonInfo">✏️ Edit</button>
                </li>
            </each>
        </ul>
    </template>

    <template-use id="app-template-use" template-id="app-template" mount-id="app"></template-use>

    <script type="module" src="./index.js"></script>

</body>
</html>
